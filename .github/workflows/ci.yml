name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-tests:
    name: Bash regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run Bash tests when present
        shell: bash
        run: |
          if [[ -f tests/scripts.tests.sh ]]; then
            bash tests/scripts.tests.sh
          else
            echo "::notice::Bash regression tests are not present yet; skipping."
          fi
          bash tests/install-prerequisites.tests.sh

  powershell-tests:
    name: PowerShell regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run PowerShell tests when present
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'tests/scripts.tests.ps1') {
            pwsh -NoLogo -NoProfile -File .\tests\scripts.tests.ps1
          }
          else {
            Write-Host 'PowerShell regression tests are not present yet; skipping.'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoLogo -NoProfile -File .\tests\dotnet-original.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($test in @('install-prerequisites', 'windows-prerequisite-updates', 'azure-actions', 'powershell-bootstrap')) {
            pwsh -NoLogo -NoProfile -File ".\tests\$test.tests.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify Windows PowerShell 5.1 entrypoints
        shell: pwsh
        run: |
          foreach ($test in @('scripts', 'dotnet-original', 'install-prerequisites', 'windows-prerequisite-updates', 'azure-actions', 'powershell-bootstrap')) {
            powershell.exe -NoLogo -NoProfile -NonInteractive -File ".\tests\$test.tests.ps1"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
